# Railway (Nixpacks) build configuration
[variables]
COREPACK_INTEGRITY_KEYS = "0"

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = [
  "npm install -g pnpm@10.26.1",
  "pnpm install --no-frozen-lockfile",
]

[phases.build]
cmds = ["pnpm run railway:build"]

[start]
cmd = "pnpm run railway:start"
