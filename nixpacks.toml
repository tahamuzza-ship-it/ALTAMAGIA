# Railway (Nixpacks) build configuration
# COREPACK_INTEGRITY_KEYS=0 avoids the corepack "Cannot find matching keyid"
# signature error when activating the pnpm version from "packageManager".
# NODE_ENV=development ensures pnpm installs devDependencies (vite, typescript,
# esbuild) needed by the build; the start command sets NODE_ENV=production
# explicitly at runtime.
[variables]
COREPACK_INTEGRITY_KEYS = "0"
NODE_ENV = "development"
NPM_CONFIG_PRODUCTION = "false"
