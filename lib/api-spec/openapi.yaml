openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: projects
    description: Bioconstruction house projects
  - name: rooms
    description: Rooms (espacios) of a project
  - name: installations
    description: Electrical and water installation elements drawn on the floor plan
  - name: materials
    description: Material price catalog
  - name: estimate
    description: Material quantity and cost estimates
  - name: dashboard
    description: Dashboard summaries
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project and its rooms
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /projects/{id}/rooms:
    get:
      operationId: listRooms
      tags: [rooms]
      summary: List rooms of a project
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Rooms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"
    post:
      operationId: createRoom
      tags: [rooms]
      summary: Add a room to a project
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /projects/{id}/installations:
    get:
      operationId: listInstallations
      tags: [installations]
      summary: List installation elements of a project
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Installation elements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Installation"
    post:
      operationId: createInstallation
      tags: [installations]
      summary: Add an installation element to a project
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Installation"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /installations/{id}:
    patch:
      operationId: updateInstallation
      tags: [installations]
      summary: Update an installation element (e.g. move it)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallationUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Installation"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    delete:
      operationId: deleteInstallation
      tags: [installations]
      summary: Delete an installation element
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /rooms/{id}:
    patch:
      operationId: updateRoom
      tags: [rooms]
      summary: Update a room
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    delete:
      operationId: deleteRoom
      tags: [rooms]
      summary: Delete a room
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /projects/{id}/estimate:
    get:
      operationId: getProjectEstimate
      tags: [estimate]
      summary: Computed material quantities and costs for a project
      description: Calculates material quantities (guadua, tierra, arena, etc.) from the project's rooms, wall system and roof type, priced with the material catalog.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estimate"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /materials:
    get:
      operationId: listMaterials
      tags: [materials]
      summary: List material catalog with prices
      responses:
        "200":
          description: Materials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Material"
    post:
      operationId: createMaterial
      tags: [materials]
      summary: Add a material to the catalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Material"
  /materials/{id}:
    patch:
      operationId: updateMaterial
      tags: [materials]
      summary: Update a material (e.g. its price)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Material"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    delete:
      operationId: deleteMaterial
      tags: [materials]
      summary: Delete a material
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Overview stats across all projects
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorMessage:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Project:
      type: object
      required: [id, name, wallSystem, roofType, status, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: ["string", "null"] }
        location: { type: ["string", "null"] }
        wallSystem:
          type: string
          enum: [bahareque, tapia_pisada, adobe, guadua_vista, mixta]
          description: Wall construction system
        roofType:
          type: string
          enum: [teja_barro, palma, zinc, techo_verde]
        status:
          type: string
          enum: [diseno, cotizado, construccion, terminado]
        notes: { type: ["string", "null"] }
        terrainAccess:
          type: ["string", "null"]
          enum: [facil, medio, dificil, null]
          description: Ease of access to the terrain
        terrainSlope:
          type: ["string", "null"]
          enum: [plano, pendiente_suave, pendiente_fuerte, null]
        waterDistanceM: { type: ["number", "null"], description: Distance to water source in meters }
        canStay: { type: ["boolean", "null"], description: Whether the crew can stay on site }
        canCook: { type: ["boolean", "null"], description: Whether the crew can cook on site }
        numPeople: { type: ["integer", "null"], description: Number of people the house is for }
        targetMonths: { type: ["number", "null"], description: Target construction time in months }
        referenceLinks:
          type: ["array", "null"]
          items: { type: string }
          description: Video or web reference links for the project
        createdAt: { type: string }
    ProjectInput:
      type: object
      required: [name, wallSystem, roofType]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        location: { type: string }
        wallSystem:
          type: string
          enum: [bahareque, tapia_pisada, adobe, guadua_vista, mixta]
        roofType:
          type: string
          enum: [teja_barro, palma, zinc, techo_verde]
        status:
          type: string
          enum: [diseno, cotizado, construccion, terminado]
        notes: { type: string }
        terrainAccess:
          type: string
          enum: [facil, medio, dificil]
        terrainSlope:
          type: string
          enum: [plano, pendiente_suave, pendiente_fuerte]
        waterDistanceM: { type: number }
        canStay: { type: boolean }
        canCook: { type: boolean }
        numPeople: { type: integer }
        targetMonths: { type: number }
        referenceLinks:
          type: array
          maxItems: 50
          items: { type: string, pattern: "^https?://", maxLength: 2000 }
    ProjectUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description: { type: ["string", "null"] }
        location: { type: ["string", "null"] }
        wallSystem:
          type: string
          enum: [bahareque, tapia_pisada, adobe, guadua_vista, mixta]
        roofType:
          type: string
          enum: [teja_barro, palma, zinc, techo_verde]
        status:
          type: string
          enum: [diseno, cotizado, construccion, terminado]
        notes: { type: ["string", "null"] }
        terrainAccess:
          type: ["string", "null"]
          enum: [facil, medio, dificil, null]
        terrainSlope:
          type: ["string", "null"]
          enum: [plano, pendiente_suave, pendiente_fuerte, null]
        waterDistanceM: { type: ["number", "null"] }
        canStay: { type: ["boolean", "null"] }
        canCook: { type: ["boolean", "null"] }
        numPeople: { type: ["integer", "null"] }
        targetMonths: { type: ["number", "null"] }
        referenceLinks:
          type: ["array", "null"]
          maxItems: 50
          items: { type: string, pattern: "^https?://", maxLength: 2000 }
    Room:
      type: object
      required: [id, projectId, name, kind, widthM, lengthM, heightM, floor]
      properties:
        id: { type: integer }
        projectId: { type: integer }
        name: { type: string }
        floor: { type: integer, description: "Floor number: 1 = planta baja, 2 = segundo piso / mezzanine" }
        kind:
          type: string
          enum: [habitacion, sala, cocina, bano, comedor, corredor, taller, otro]
        widthM: { type: number, description: Width in meters }
        lengthM: { type: number, description: Length in meters }
        heightM: { type: number, description: Wall height in meters }
        posX: { type: ["number", "null"], description: X position in meters on the floor plan }
        posY: { type: ["number", "null"], description: Y position in meters on the floor plan }
    RoomInput:
      type: object
      required: [name, kind, widthM, lengthM, heightM]
      properties:
        name: { type: string, minLength: 1 }
        floor: { type: integer, minimum: 1, maximum: 2, default: 1 }
        kind:
          type: string
          enum: [habitacion, sala, cocina, bano, comedor, corredor, taller, otro]
        widthM: { type: number, exclusiveMinimum: 0 }
        lengthM: { type: number, exclusiveMinimum: 0 }
        heightM: { type: number, exclusiveMinimum: 0 }
        posX: { type: number }
        posY: { type: number }
    RoomUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        floor: { type: integer, minimum: 1, maximum: 2 }
        kind:
          type: string
          enum: [habitacion, sala, cocina, bano, comedor, corredor, taller, otro]
        widthM: { type: number, exclusiveMinimum: 0 }
        lengthM: { type: number, exclusiveMinimum: 0 }
        heightM: { type: number, exclusiveMinimum: 0 }
        posX: { type: ["number", "null"] }
        posY: { type: ["number", "null"] }
    InstallationPoint:
      type: object
      required: [x, y]
      properties:
        x: { type: number, description: X in meters on the floor plan }
        y: { type: number, description: Y in meters on the floor plan }
    Installation:
      type: object
      required: [id, projectId, floor, layer, kind, points]
      properties:
        id: { type: integer }
        projectId: { type: integer }
        floor: { type: integer }
        layer:
          type: string
          enum: [electrica, agua]
        kind:
          type: string
          enum: [toma, interruptor, lampara, tablero, cable, llave, ducha, desague, tanque, tuberia]
        points:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/InstallationPoint"
    InstallationInput:
      type: object
      required: [layer, kind, points]
      properties:
        floor: { type: integer, minimum: 1, maximum: 2, default: 1 }
        layer:
          type: string
          enum: [electrica, agua]
        kind:
          type: string
          enum: [toma, interruptor, lampara, tablero, cable, llave, ducha, desague, tanque, tuberia]
        points:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/InstallationPoint"
    InstallationUpdate:
      type: object
      properties:
        floor: { type: integer, minimum: 1, maximum: 2 }
        points:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/InstallationPoint"
    Material:
      type: object
      required: [id, name, unit, unitPrice, category]
      properties:
        id: { type: integer }
        name: { type: string }
        unit: { type: string, description: "Unit of measure, e.g. unidad, m3, bulto, m2" }
        unitPrice: { type: number, description: Price per unit in COP }
        category:
          type: string
          enum: [estructura, muros, cubierta, acabados, otros]
    MaterialInput:
      type: object
      required: [name, unit, unitPrice, category]
      properties:
        name: { type: string, minLength: 1 }
        unit: { type: string, minLength: 1 }
        unitPrice: { type: number, minimum: 0 }
        category:
          type: string
          enum: [estructura, muros, cubierta, acabados, otros]
    MaterialUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        unit: { type: string, minLength: 1 }
        unitPrice: { type: number, minimum: 0 }
        category:
          type: string
          enum: [estructura, muros, cubierta, acabados, otros]
    EstimateItem:
      type: object
      required: [materialName, category, quantity, unit, unitPrice, subtotal, priced]
      properties:
        materialName: { type: string }
        category:
          type: string
          enum: [estructura, muros, cubierta, acabados, otros]
        quantity: { type: number }
        unit: { type: string }
        unitPrice: { type: number, description: 0 when the material is not in the catalog }
        subtotal: { type: number }
        priced: { type: boolean, description: False when no catalog price was found }
        formula: { type: string, description: Human-readable explanation (Spanish) of how the quantity was computed }
    Estimate:
      type: object
      required: [projectId, floorAreaM2, wallAreaM2, roofAreaM2, items, totalCost]
      properties:
        projectId: { type: integer }
        floorAreaM2: { type: number }
        wallAreaM2: { type: number }
        roofAreaM2: { type: number }
        items:
          type: array
          items:
            $ref: "#/components/schemas/EstimateItem"
        totalCost: { type: number }
    StatusCount:
      type: object
      required: [status, count]
      properties:
        status: { type: string }
        count: { type: integer }
    DashboardSummary:
      type: object
      required: [totalProjects, totalRooms, totalFloorAreaM2, byStatus]
      properties:
        totalProjects: { type: integer }
        totalRooms: { type: integer }
        totalFloorAreaM2: { type: number }
        byStatus:
          type: array
          items:
            $ref: "#/components/schemas/StatusCount"
